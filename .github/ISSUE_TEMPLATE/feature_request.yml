name: ✨ 功能请求 | Feature Request
description: 提出新功能或改进建议 Propose a new feature or improvement
title: "[Feature]: "
labels: ["feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        描述清楚「问题」与「价值」，比描述「方案」更重要。
        A clear problem & value statement matters more than a solution sketch.

  - type: dropdown
    id: module
    attributes:
      label: 目标智能体/模块 | Target Agent / Module
      options:
        - "mod:tianshu 天枢 · 首页/Dashboard/MCP/Governance"
        - "mod:bole 伯乐 · Models 模型资产"
        - "mod:wanyu 万语 · Playground 推理场"
        - "mod:qianxing 千行 · Routing 路由策略"
        - "mod:zongshi 宗师 · Knowledge 知识库/RAG"
        - "mod:lingyun 凌云 · Cache 缓存 / Branding 品牌"
        - "mod:xianzhi 仙知 · Monitor 监控"
        - "mod:zhihui 智绘 · Security 安全"
        - "mod:contract 契约 · api.ts / openapi 快照"
        - "mod:infra 基础设施 · CI/CD / scripts"
        - "mod:docs 文档 · docs/ / README"
        - "mod:pwa 多端 · manifest / sw / icons"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题/动机 | Problem & Motivation
      description: 当前哪里不方便或不完整 What is missing or painful today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 | Proposed Solution
      description: 期望的行为与大致实现思路 Desired behavior & rough approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 | Alternatives Considered

  - type: checkboxes
    id: ack
    attributes:
      label: 确认 | Acknowledgement
      options:
        - label: 我已搜索现有 Issue，确认无重复 I have searched existing issues for duplicates
          required: true
