name: Visual Gate

# 🎨 YYC³ 视觉基线门禁（P3 · 文档04 ⑪ Playwright screenshot）
# 快照基线 = e2e/*.spec.ts-snapshots/（已随仓库提交）
# 变更审阅 → pnpm test:visual:update 重新冻结

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "e2e/visual*.spec.ts"
      - "e2e/*.spec.ts-snapshots/**"
      - "playwright.config.ts"
      - ".github/workflows/visual.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-regression:
    name: "🎨 Visual · 12 routes × dark/light + 8 badges"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本经 package.json#packageManager 锁定（Corepack 闭环）

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run visual regression (32 baselines)
        # Linux 渲染与基线平台一致（快照名含 -linux 后缀）
        run: pnpm test:visual

      - name: Upload diff artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results/
            e2e/reports/
          retention-days: 14

      - name: Diff review guide
        if: failure()
        run: |
          echo "::error::视觉回归！差异报告已上传至 Artifacts (visual-diff)。"
          echo "  审阅流程："
          echo "  1. 本地运行 pnpm test:visual 复现差异"
          echo "  2. 确认为预期变更 → pnpm test:visual:update 冻结新基线并提交"
          echo "  3. 非预期变更 → 检查最近 CSS / 布局 / 字体改动"
