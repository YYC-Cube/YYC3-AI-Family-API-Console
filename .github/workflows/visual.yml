name: Visual Gate

# 🎨 YYC³ 视觉基线门禁（P3 · 文档04 ⑪ Playwright screenshot）
# 快照基线 = e2e/*.spec.ts-snapshots/（已随仓库提交）
# 变更审阅 → pnpm test:visual:update 重新冻结

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "e2e/visual*.spec.ts"
      - "e2e/*.spec.ts-snapshots/**"
      - "playwright.config.ts"
      - ".github/workflows/visual.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-regression:
    name: "🎨 Visual · 12 routes × dark/light + 8 badges"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本经 package.json#packageManager 锁定（Corepack 闭环）

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Detect baseline phase
        id: phase
        # 完整 -linux 基线集 = 35（dashboard/branding 2 + badges 9 + routes 24）。
        # darwin 基线仅为 macOS 本地参照，CI 门禁真值是 -linux 后缀基线。
        # 少于 35 → 首跑引导：--update-snapshots 冻结全部缺失基线（写入 snapshots 目录）；
        # 达到 35 → 严格门禁：任何像素级回归直接失败。
        run: |
          total=35
          count=$(git ls-files 'e2e/*-snapshots/*-linux.png' | wc -l | tr -d ' ')
          echo "已跟踪的 -linux 基线数：$count / $total"
          if [ "$count" -lt "$total" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap missing Linux baselines
        # 基线自愈：仓库基线生成于 macOS(darwin)，Linux 平台快照带 -linux 后缀。
        # 引导阶段用 --update-snapshots 从当前渲染冻结缺失基线（写入 snapshots 目录），
        # 测试整体退出码在此阶段不作为门禁；bot 回推后，后续所有推送进入严格 diff。
        if: steps.phase.outputs.bootstrap == 'true'
        run: pnpm test:visual:update
        continue-on-error: true

      - name: Freeze & push Linux baselines
        if: steps.phase.outputs.bootstrap == 'true'
        run: |
          git add e2e || true
          if git diff --cached --quiet; then
            echo "::error::首跑引导未产出任何 -linux 基线，请人工排查"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): freeze linux baselines (bootstrap)"
          git push
          echo "Linux 基线已冻结并回推（本流水线以引导阶段通过）"

      - name: Run visual regression (strict)
        # 基线已入库 → 严格视觉门禁：任何像素级回归直接失败
        if: steps.phase.outputs.bootstrap == 'false'
        run: pnpm test:visual

      - name: Upload diff artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results/
            e2e/reports/
          retention-days: 14

      - name: Diff review guide
        if: failure()
        run: |
          echo "::error::视觉回归！差异报告已上传至 Artifacts (visual-diff)。"
          echo "  审阅流程："
          echo "  1. 本地运行 pnpm test:visual 复现差异"
          echo "  2. 确认为预期变更 → pnpm test:visual:update 冻结新基线并提交"
          echo "  3. 非预期变更 → 检查最近 CSS / 布局 / 字体改动"
