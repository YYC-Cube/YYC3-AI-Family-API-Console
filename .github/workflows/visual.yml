name: Visual Gate

# 🎨 YYC³ 视觉基线门禁（P3 · 文档04 ⑪ Playwright screenshot）
# 快照基线 = e2e/*.spec.ts-snapshots/（已随仓库提交）
# 变更审阅 → pnpm test:visual:update 重新冻结

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "e2e/visual*.spec.ts"
      - "e2e/*.spec.ts-snapshots/**"
      - "playwright.config.ts"
      - ".github/workflows/visual.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-regression:
    name: "🎨 Visual · 12 routes × dark/light + 8 badges"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本经 package.json#packageManager 锁定（Corepack 闭环）

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run visual regression (32 baselines)
        # 基线自愈（首跑冻结，次跑严格）：
        # 仓库现有基线于 macOS(darwin) 生成；Linux 平台快照自动携带 -linux 后缀，
        # 首跑缺失基线时由 --update-snapshots=missing 生成（即冻结），后续推送进入严格 diff
        run: pnpm test:visual --update-snapshots=missing

      - name: Commit regenerated Linux baselines
        # Linux 首跑生成的新基线直接回推 main，闭环次跑起严格门禁
        if: success()
        run: |
          if [ -n "$(git status --porcelain e2e/*.spec.ts-snapshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "e2e/*.spec.ts-snapshots"
            git commit -m "test(visual): freeze linux baselines (first-run bootstrap)"
            git push
            echo "Linux 基线已冻结并回推"
          else
            echo "基线无变化（严格 diff 通过）"
          fi

      - name: Upload diff artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results/
            e2e/reports/
          retention-days: 14

      - name: Diff review guide
        if: failure()
        run: |
          echo "::error::视觉回归！差异报告已上传至 Artifacts (visual-diff)。"
          echo "  审阅流程："
          echo "  1. 本地运行 pnpm test:visual 复现差异"
          echo "  2. 确认为预期变更 → pnpm test:visual:update 冻结新基线并提交"
          echo "  3. 非预期变更 → 检查最近 CSS / 布局 / 字体改动"
