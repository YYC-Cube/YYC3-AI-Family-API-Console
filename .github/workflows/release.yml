name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Manual version (e.g. v1.2.3)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: "✅ Pre-release Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm format --check
      - name: Build
        run: pnpm build

  release-build:
    name: "📦 Build Artifacts"
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  release-publish:
    name: "🚀 GitHub Release + Pages"
    runs-on: ubuntu-latest
    needs: release-build
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Package dist → single zip
        run: |
          cd dist
          zip -r ../yyc3-console-dist.zip .
          cd ..
          echo "## sha256" >> $GITHUB_STEP_SUMMARY
          sha256sum yyc3-console-dist.zip >> $GITHUB_STEP_SUMMARY

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## YYC³ AI Family Token Console · ${{ github.ref_name }}

            > *言启千行 · 语枢万物智能*

            ### 📥 访问方式
            - **Web / PWA**：打开 [token.yyc3.top](https://token.yyc3.top) → 浏览器「安装至桌面/主屏幕」
            - **离线分发**：下载附件 `yyc3-console-dist.zip`（静态构建产物）解压本地托管运行

            ### 📦 本次变更
            ${{ steps.changelog.outputs.changelog }}
          files: yyc3-console-dist.zip
          generate_release_notes: true

  release-notify:
    name: "📣 Notify"
    runs-on: ubuntu-latest
    needs: release-publish
    if: always()
    steps:
      - name: On failure → admin@
        if: failure()
        run: echo "Release FAILED for ${{ github.ref_name }} — notify admin@0379.email"
      - name: On success → broadcast
        if: success()
        run: echo "Release ${{ github.ref_name }} published ✅ — broadcast via dev@0379.email"
